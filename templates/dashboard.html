<!DOCTYPE html>
<html>
<head>
    <title>PC Utils Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .stats-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .stat-item {
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💻 PC Utils Dashboard</h1>
        
        <div class="grid">
            <div class="card">
                <h2 style="margin-bottom: 20px;">Disk Usage</h2>
                <div class="chart-container">
                    <canvas id="diskChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <h2 style="margin-bottom: 20px;">Statistics</h2>
                <div class="stats-container">
                    <div class="stat-item">
                        <div class="stat-label">Total Deleted (All Time)</div>
                        <div class="stat-value" id="deleted-stat">Loading...</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total Storage</div>
                        <div class="stat-value" id="total-storage">Loading...</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Free Space</div>
                        <div class="stat-value" id="free-storage">Loading...</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Log Number</div>
                        <div class="stat-value" id="log-number">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Function to convert bytes to human readable format
        function formatBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let size = bytes;
            let unitIndex = 0;
            
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            
            return `${size.toFixed(2)} ${units[unitIndex]}`;
        }

        // Fetch stats from backend
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                // Update stats display
                document.getElementById('deleted-stat').textContent = formatBytes(data.deleted_all_time);
                document.getElementById('total-storage').textContent = formatBytes(data.total_storage);
                document.getElementById('free-storage').textContent = formatBytes(data.free_storage);
                document.getElementById('log-number').textContent = data.log_number;
                
                // Create doughnut chart
                const ctx = document.getElementById('diskChart').getContext('2d');
                
                // Check if chart already exists and destroy it
                if (window.diskChartInstance) {
                    window.diskChartInstance.destroy();
                }
                
                window.diskChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Used', 'Free'],
                        datasets: [{
                            data: [data.used_storage, data.free_storage],
                            backgroundColor: ['#FF6384', '#36A2EB'],
                            borderColor: ['#FF6384', '#36A2EB'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load stats when page loads
        document.addEventListener('DOMContentLoaded', loadStats);
        
        // Refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
